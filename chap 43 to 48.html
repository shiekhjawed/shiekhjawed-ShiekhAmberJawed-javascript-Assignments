<body>

    <script>
        var deleteButtons = document.getElementsByClassName('deleteBtn');
        for(var i = 0; i < deleteButtons.length; i++) {
            deleteButtons[i].onclick = function() {
                if(confirm('Are you sure you want to delete this record?')) {
                    var row = this.parentNode.parentNode;
                    row.parentNode.removeChild(row);
                }
            };
        }
</script>


    <!--  4. Counter with increase and decrease buttons -->
      
        <div class="counter-container">
        <h2>Counter: <span id="counterValue">0</span></h2>
        <button id="increaseBtn">Increase</button>
        <button id="decreaseBtn">Decrease</button>
    </div>

    <script>
        var counterValue = 0;
        var counterDisplay = document.getElementById('counterValue');
        var increaseBtn = document.getElementById('increaseBtn');
        var decreaseBtn = document.getElementById('decreaseBtn');

        increaseBtn.onclick = function() {
            counterValue++;
            counterDisplay.innerHTML = counterValue;
        };

        decreaseBtn.onclick = function() {
            counterValue--;
            counterDisplay.innerHTML = counterValue;
        };
    </script>
    <!-- // 5. Image hover to change source -->
        <h3>Hover over the image</h3>
    <img id="hoverImg" src="./italianpasta.jpeg" alt="Hover Image" width="250px" height="250px"
         style="cursor:pointer; border:2px solid #ccc;">

    <script>
        var img = document.getElementById('hoverImg');
        var originalSrc = img.src;
        
        img.onmouseover = function() {
            img.src = './cheeseburger.jpeg';  // ✅ Shows Italian Pasta on hover
        };
        
        img.onmouseout = function() {
            img.src = './salaad.jpeg';          // ✅ Shows Cakes when mouse leaves
        };
    </script>
