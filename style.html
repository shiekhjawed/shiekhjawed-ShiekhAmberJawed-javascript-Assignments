// 1. Student Result System: Create a student object and check pass/fail based on marks.
// Create student objects

// 1. Student Result System

var student1 = {
    name: "Salaar",
    marks: 95
};

var student2 = {
    name: "Ziyaan",
    marks: 30
};

// function to check result
function checkResult(stu) {
    if (stu.marks >= 35) {
        console.log(`${stu.name} Pass`);
    } else {
        console.log(`${stu.name} Fail`);
    }
}

checkResult(student1);
checkResult(student2);
</script>

    <script>
    
// 8. Bank Account System: Constructor with deposit and withdraw methods.

function BankAccount(balance) {
    this.balance = balance;

    this.deposit = function(amount) {
        this.balance += amount;
    };

    this.withdraw = function(amount) {
        this.balance -= amount;
    };
}

var acc = new BankAccount(1000);
acc.deposit(500);
acc.withdraw(200);

console.log(acc.balance);
</script>

<script>
// 12. Student Management System: Add students, find topper, and fail list.

var students = [
    { name: "ziyaan", marks: 80 },
    { name: "rija", marks: 40 },
    { name: "salaar", marks: 90 },
    { name: "Ayaan", marks: 30 }
];

var topper = students[0];
var failList = [];

for (var i = 0; i < students.length; i++) {
    if (students[i].marks > topper.marks) {
        topper = students[i];
    }

    if (students[i].marks < 50) {
        failList.push(students[i].name);
    }
}

console.log("Topper:", topper.name);
console.log("Fail List:", failList);
</script>
<script>
// 13. Shopping Cart Object System: Calculate total and update quantities.

var cart = [
    { name: "Item1",
     price: 100,
      qty: 5 },
    { name: "Item2", 
    price: 50,
     qty: 3 }
];

var total = 0;

for (var i = 0; i < cart.length; i++) {
    total += cart[i].price * cart[i].qty;
}

console.log("Total:", total);
</script>
